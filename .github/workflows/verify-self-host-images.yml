name: Verify self-hosted images

on:
  push:
    branches: [self-host-images]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock=false
      - run: npx playwright install --with-deps chromium
      - run: npm run build:dist
      - run: node scripts/check-static.js && node scripts/check-dist.js
      - name: Full browser suite including all three self-hosted-image checks
        run: npm run test:browser
        env:
          ONLINE: '1'
      - name: Save browser results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-verification-results
          path: |
            test-report/
            test-results/
          retention-days: 7
